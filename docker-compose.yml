services:
  local-llm-api:
    build: .
    container_name: local-llm-api

    restart: unless-stopped

    env_file:
      - .env

    # Internal only: reachable from other containers on ai_platform at
    # http://local-llm-api:8000. No host port is published.
    expose:
      - "8000"

    environment:
      VIRTUAL_HOST: ${APP_DOMAIN:?Set APP_DOMAIN in the VPS .env}
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: ${APP_DOMAIN:?Set APP_DOMAIN in the VPS .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set your existing certificate registration email in the VPS .env}
      LOCAL_LLM_API_TOKEN: ${LOCAL_LLM_API_TOKEN:?Set a strong API bearer token in the VPS .env}

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - ai_platform
      - model_private

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - model_private

volumes:
  ollama_data:

networks:
  ai_platform:
    external: true
  # Separate bridge with outbound access for model downloads; no host ports.
  model_private:
