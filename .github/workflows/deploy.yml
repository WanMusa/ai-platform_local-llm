name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            DEPLOY_DIR="$HOME/projects/ai-platform_local-llm"

            # Create parent directory if it doesn't exist
            mkdir -p "$HOME/projects"

            # First deployment: clone repo
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
                echo "=== FIRST DEPLOYMENT ==="
                echo "Repository not found. Cloning..."

              CLONE_DIR=$(mktemp -d "$HOME/projects/local-llm-clone.XXXXXX")
              git clone --branch main https://github.com/WanMusa/ai-platform_local-llm.git "$CLONE_DIR"

              if [ -e "$DEPLOY_DIR" ]; then
                BACKUP_DIR=$(mktemp -d "$HOME/projects/local-llm-backup.XXXXXX")
                mv "$DEPLOY_DIR" "$BACKUP_DIR/original"
                echo "Existing deployment files backed up to $BACKUP_DIR/original"
                if [ -f "$BACKUP_DIR/original/.env" ]; then
                  cp -p "$BACKUP_DIR/original/.env" "$CLONE_DIR/.env"
                fi
              fi

              mv "$CLONE_DIR" "$DEPLOY_DIR"
            else
                echo "=== EXISTING DEPLOYMENT ==="

                cd "$DEPLOY_DIR"

                echo "=== BEFORE ==="
                git rev-parse HEAD

                git fetch origin
                git reset --hard origin/main
            fi

            cd "$DEPLOY_DIR"

            if [ ! -f .env ]; then
                echo "ERROR: $DEPLOY_DIR/.env not found."
                echo "Create it from .env.example on the VPS, then re-run this workflow."
                exit 1
            fi

            if ! docker network inspect ai_platform >/dev/null 2>&1; then
                echo "Creating ai_platform network..."
                docker network create ai_platform
            else
                echo "ai_platform network already exists"
            fi

            docker compose up -d --build --remove-orphans

            echo "=== AFTER ==="
            git rev-parse HEAD

            echo "=== DEPLOY COMPLETE ==="
